<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <div id="book-list">
        <div class="book" data-genre="fiction">
            <h3>Đắc Nhân Tâm</h3>
            <p class="price">120.000đ</p>
        </div>
        <div class="book" data-genre="skill">
            <h3>Tư Duy Nhanh và Chậm</h3>
            <p class="price">150.000đ</p>
        </div>
        <div class="book" data-genre="fiction">
            <h3>Nhà Giả Kim</h3>
            <p class="price">89.000đ</p>
        </div>
    </div>
    <button id="btnonclick">Click to</button>
    <script>
        $('#btnonclick').click(function() {
            var arr = $('.book').length;
            console.log('.book', arr);
        });
        $("#book-list").append(`
  <div class="book" data-genre="skill">
    <h3>7 Thói Quen Hiệu Quả</h3>
    <p class="price">135.000đ</p>
  </div>
`);


        $(".price").css({
            "color": "red",
            "font-weight": "bold"
        });
    </script>
</body>

</html>
